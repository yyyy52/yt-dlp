name: Probe Neiro Proxy

on:
  push:
    paths:
      - '.github/workflows/probe-neiro-proxy.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe Hitparad page
        run: |
          python - <<'PY'
          import urllib.request,re,html
          u='https://hitparad.fm/tracks/kreva'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          txt=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','ignore')
          print('len',len(txt))
          for needle in ['Neiro','音色','neiro']:
              pos=txt.lower().find(needle.lower())
              print('needle',needle,'pos',pos)
              if pos>=0:
                  print(txt[max(0,pos-2500):pos+5000])
          print('--- media-like urls ---')
          for m in re.findall(r'''(?:href|src|data-src|data-url|data-file)=[\"']([^\"']+)[\"']''',txt,re.I):
              s=html.unescape(m)
              if any(x in s.lower() for x in ['mp3','audio','download','track']): print(s)
          print('--- raw mp3 refs ---')
          for m in re.findall(r'''[^\"'<> ]+\.mp3(?:\?[^\"'<> ]*)?''',txt,re.I): print(html.unescape(m))
          PY
