name: Fetch Propose Audio

on:
  push:
    paths:
      - '.github/workflows/fetch-propose-audio.yml'
  workflow_dispatch:

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U 'yt-dlp[default]'
          yt-dlp --version

      - name: Download official Niconico audio
        run: |
          yt-dlp \
            --verbose \
            --no-playlist \
            -f 'bestaudio/best' \
            --write-info-json \
            -o 'propose_original.%(ext)s' \
            'https://www.nicovideo.jp/watch/sm45388910'
          ls -lh propose_original.*

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: propose-original-audio
          path: propose_original.*
          if-no-files-found: error
          retention-days: 1
