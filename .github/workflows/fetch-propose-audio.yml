name: Fetch Propose Audio

on:
  push:
    paths:
      - '.github/workflows/fetch-propose-audio.yml'
  workflow_dispatch:

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -U numpy 'yt-dlp[default]'
          python -m pip install -U torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -U demucs
          yt-dlp --version
          ffmpeg -version | head -n 1

      - name: Download official audio from Niconico
        run: |
          yt-dlp \
            --no-playlist \
            -f 'bestaudio/best' \
            -x --audio-format wav --audio-quality 0 \
            --write-info-json \
            -o 'propose_original.%(ext)s' \
            'https://www.nicovideo.jp/watch/sm45388910'
          ls -lh propose_original.*

      - name: Separate lead vocal
        run: |
          python -m demucs -n htdemucs --two-stems=vocals -o demucs_out propose_original.wav
          cp demucs_out/htdemucs/propose_original/vocals.wav propose_vocals.wav
          cp demucs_out/htdemucs/propose_original/no_vocals.wav propose_no_vocals.wav
          ls -lh propose_vocals.wav propose_no_vocals.wav

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: propose-original-analysis
          path: |
            propose_original.wav
            propose_original.info.json
            propose_vocals.wav
            propose_no_vocals.wav
          if-no-files-found: error
          retention-days: 1
