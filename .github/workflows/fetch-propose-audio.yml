name: Fetch Propose Audio

on:
  push:
    paths:
      - '.github/workflows/fetch-propose-audio.yml'
  workflow_dispatch:

jobs:
  fetch-audio:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U 'yt-dlp[default]' curl-cffi
          node --version
          yt-dlp --version

      - name: Download official bestaudio
        run: |
          yt-dlp \
            --verbose \
            --no-playlist \
            --js-runtimes node \
            --impersonate chrome \
            --extractor-args 'youtube:player_client=tv,web_embedded,android_vr,default' \
            -f 'bestaudio/best' \
            --write-info-json \
            -o 'propose_original.%(ext)s' \
            'https://www.youtube.com/watch?v=VDdLF1YubI0'
          ls -lh propose_original.*

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: propose-original-audio
          path: propose_original.*
          if-no-files-found: error
          retention-days: 1
