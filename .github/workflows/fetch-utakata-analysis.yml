name: Fetch Utakata Analysis

on:
  push:
    paths:
      - '.github/workflows/fetch-utakata-analysis.yml'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libchromaprint-tools
          python -m pip install --upgrade pip
          python -m pip install -U 'yt-dlp[default]' numpy scipy librosa soundfile
          python -m pip install -U torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -U demucs

      - name: Download full-length proxy
        run: |
          yt-dlp --no-playlist -f 'bestaudio/best' -x --audio-format wav --audio-quality 0 \
            --write-info-json -o 'utakata_master.%(ext)s' \
            'https://soundcloud.com/homeless-mochi/nqrse-2'
          ffprobe -v error -show_entries format=duration -of csv=p=0 utakata_master.wav

      - name: Download official release preview
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, json
          q=urllib.parse.urlencode({'term':'泡沫の夜 nqrse','country':'jp','media':'music','limit':20})
          with urllib.request.urlopen('https://itunes.apple.com/search?'+q, timeout=30) as r:
              data=json.load(r)
          hit=None
          for x in data.get('results',[]):
              if x.get('trackName')=='泡沫の夜' and str(x.get('artistName','')).lower()=='nqrse':
                  hit=x; break
          if not hit:
              raise SystemExit('official preview not found')
          print('track=',hit.get('trackName'),'artist=',hit.get('artistName'),'ms=',hit.get('trackTimeMillis'))
          p=hit.get('previewUrl')
          if not p: raise SystemExit('previewUrl missing')
          urllib.request.urlretrieve(p,'official_preview.m4a')
          open('official_preview.json','w',encoding='utf-8').write(json.dumps(hit,ensure_ascii=False,indent=2))
          PY
          ffmpeg -y -i official_preview.m4a -ar 44100 -ac 2 official_preview.wav >/dev/null 2>&1

      - name: Fingerprint-verify proxy
        run: |
          python - <<'PY'
          import subprocess,json
          def fp(p):
              return json.loads(subprocess.check_output(['fpcalc','-raw','-json',p],text=True))['fingerprint']
          full=fp('utakata_master.wav'); prev=fp('official_preview.wav')
          trim=max(5,min(18,len(prev)//10)); p=prev[trim:len(prev)-trim]
          best=(99,None)
          for off in range(len(full)-len(p)+1):
              s=sum((int(a)^int(b)).bit_count() for a,b in zip(p,full[off:off+len(p)]))/len(p)
              if s<best[0]: best=(s,off)
          print('best_mean_hamming=',best[0],'offset_frame=',best[1])
          if best[0]>7.0: raise SystemExit('fingerprint mismatch')
          open('fingerprint.txt','w').write(f'{best[0]:.4f} {best[1]}\n')
          PY

      - name: Download official instrumental
        run: |
          python - <<'PY'
          import urllib.request
          url='https://www.dropbox.com/s/vmfvkfqvt1f1xys/utakata2mixinst.wav?dl=1'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=60) as r, open('utakata_inst_download','wb') as f:
              f.write(r.read())
          PY
          ffmpeg -y -i utakata_inst_download -ar 44100 -ac 2 utakata_inst.wav >/dev/null 2>&1

      - name: Align master and official inst
        run: |
          python - <<'PY'
          import json, numpy as np, soundfile as sf
          from scipy.signal import correlate, correlation_lags
          m,sr=sf.read('utakata_master.wav',always_2d=True); i,sri=sf.read('utakata_inst.wav',always_2d=True)
          if sr!=sri: raise SystemExit((sr,sri))
          m=m.mean(1); i=i.mean(1)
          step=max(1,sr//8000); n0=min(len(m),len(i),sr*180)
          a=m[:n0:step]; b=i[:n0:step]
          a=(a-a.mean())/(a.std()+1e-9); b=(b-b.mean())/(b.std()+1e-9)
          c=correlate(a,b,mode='full',method='fft'); l=correlation_lags(len(a),len(b),mode='full')
          keep=np.abs(l)<=int(2*sr/step); lag=int(l[keep][np.argmax(c[keep])]); lag_sec=lag*step/sr
          lf=int(round(lag_sec*sr))
          if lf>=0: ma=m[lf:]; ia=i[:len(ma)]
          else: ia=i[-lf:]; ma=m[:len(ia)]
          n=min(len(ma),len(ia)); ma=ma[:n]; ia=ia[:n]
          gain=float(np.dot(ma,ia)/(np.dot(ia,ia)+1e-12)); corr=float(np.corrcoef(ma[::20],(gain*ia)[::20])[0,1])
          out={'sample_rate':sr,'master_duration':len(m)/sr,'inst_duration':len(i)/sr,'lag_sec':lag_sec,'inst_gain':gain,'wave_corr':corr}
          print(json.dumps(out,indent=2)); open('alignment.json','w').write(json.dumps(out,indent=2))
          PY

      - name: Fetch LRCLIB timing candidate
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, json
          q=urllib.parse.urlencode({'track_name':'泡沫の夜','artist_name':'nqrse'})
          req=urllib.request.Request('https://lrclib.net/api/search?'+q,headers={'User-Agent':'ChatGPT-analysis/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
          for x in data: print(x.get('trackName'),x.get('artistName'),x.get('duration'),bool(x.get('syncedLyrics')))
          open('lrclib.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2))
          PY

      - name: Separate vocals
        run: |
          python -m demucs -n htdemucs --two-stems=vocals -o demucs_out utakata_master.wav
          cp demucs_out/htdemucs/utakata_master/vocals.wav utakata_vocals.wav
          cp demucs_out/htdemucs/utakata_master/no_vocals.wav utakata_no_vocals.wav

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: utakata-analysis
          retention-days: 1
          if-no-files-found: error
          path: |
            utakata_master.wav
            utakata_master.info.json
            official_preview.json
            fingerprint.txt
            utakata_inst.wav
            utakata_vocals.wav
            utakata_no_vocals.wav
            alignment.json
            lrclib.json
